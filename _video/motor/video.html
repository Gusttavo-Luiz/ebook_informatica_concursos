<!DOCTYPE html>
<html lang="pt-BR">
<head>

<link href="estilo.css" rel="stylesheet"/>

<script src="componentes.js"></script>
<script src="motor.js"></script>

<body>
<div id="palco"></div>
<script>
  // Carrega o roteiro indicado em ?cap=N (padrão: 1).
  const cap = new URLSearchParams(location.search).get("cap") || "1";
  const s = document.createElement("script");
  s.src = `../roteiros/cap${cap}.js`;
  s.onload = () => document.fonts.ready.then(() => { window.PRONTO = true; });
  document.head.appendChild(s);
</script>
</body>
